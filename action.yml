name: "SkillGuard Action"
description: "Audit, lint, and security-scan AI Agent Skills (SKILL.md) in your CI pipeline."
author: "Eslam Elzamkan"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Path to skills directory or SKILL.md file"
    required: false
    default: "."
  format:
    description: "Output format: terminal, json, or github"
    required: false
    default: "github"
  ignore:
    description: "Comma-separated list of rule codes to ignore (e.g. SF008,SF201)"
    required: false
    default: ""
  audit-only:
    description: "Only run security and safety audits (SF1xx, SF2xx)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install SkillGuard
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run SkillGuard
      shell: bash
      run: |
        CMD="skillguard"
        if [ "${{ inputs.audit-only }}" = "true" ]; then
          CMD="$CMD audit"
        else
          CMD="$CMD check"
        fi
        
        ARGS="${{ inputs.path }} --format ${{ inputs.format }}"
        if [ -n "${{ inputs.ignore }}" ]; then
          ARGS="$ARGS --ignore ${{ inputs.ignore }}"
        fi
        
        $CMD $ARGS

